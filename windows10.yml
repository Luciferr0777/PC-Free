# Windows 10 in GitHub Codespaces — tuned for the free 2-core tier.
# Run: docker-compose -f windows10.yml up -d
services:
  windows:
    image: dockurr/windows
    container_name: windows
    environment:
      VERSION: "10"
      USERNAME: ${WINDOWS_USERNAME}
      PASSWORD: ${WINDOWS_PASSWORD}
      RAM_SIZE: "6G"
      CPU_CORES: "2"
      DISK_SIZE: "32G"
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"
      - "3389:3389/tcp"
    volumes:
      - /tmp/pcfree-share:/mnt/disco1
      - /tmp/pcfree-storage:/storage
      - windows-data:/mnt/windows-data
    # This Codespace exposes /dev/kvm, so hardware acceleration is enabled.
    devices:
      - "/dev/kvm:/dev/kvm"
    stop_grace_period: 2m
    restart: always

volumes:
  windows-data:
